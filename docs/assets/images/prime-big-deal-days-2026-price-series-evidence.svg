<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Four observed Amazon prices from a live Nexscope API test</title>
  <desc id="desc">A live US Amazon price-series request for ASIN B072MQ5BRX returned four price observations: 16.62 dollars on August 18, 9.69 dollars on August 31, 16.62 dollars on September 1, and 16.32 dollars on September 3, 2026. The deal-price array was empty. These are sampled points, not a continuous trend or proof of a promotion.</desc>
